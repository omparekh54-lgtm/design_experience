# API only. GitHub Actions owns collection; do not add a second scheduler.
# Confirm the workspace and existing service identity before applying this file.
services:
  - type: web
    name: pms-cloud-api
    runtime: python
    plan: free
    repo: https://github.com/omparekh54-lgtm/design_experience
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements-ops.txt
    startCommand: python scripts/start_cloud_api.py
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: EXECUTION_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: 'false'
      - key: RUN_REFERENCE_GAP_BACKFILL
        value: '0'
      - key: PMS_ALLOW_PRIVATE_HTTP
        value: '0'
      - key: PMS_CLOUD_COLLECTION_REQUIRED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: OPS_API_KEY
        generateValue: true

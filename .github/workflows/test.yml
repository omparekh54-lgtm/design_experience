name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cloud-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe official sources without database or trading secrets
        # External availability is evidence, not a unit-test or campaign pass.
        continue-on-error: true
        run: python scripts/run_cloud_collection.py --probe --output artifacts/cloud-source-probe.json
      - name: Preserve source-access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-cloud-source-probe
          path: artifacts/cloud-source-probe.json
          if-no-files-found: error
          retention-days: 14
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Save offline deployment readiness inventory
        run: python scripts/check_deployment_readiness.py --plan --output artifacts/deployment-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: pms-deployment-readiness
          path: artifacts/deployment-readiness.json
          retention-days: 14

  ops-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ops.txt
      - run: pytest -q tests/test_worker_reliability.py
      - run: python -c "from packages.pms.workers import celery_app; import packages.pms.worker_tasks_extended; print(sorted(celery_app.conf.beat_schedule))"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Install UI test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: UI interaction and responsive smoke
        run: node tests/smoke.mjs
      - name: Save UI screenshots and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-ui-smoke
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

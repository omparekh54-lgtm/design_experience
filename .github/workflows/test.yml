name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  neon-copy-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PMS_COPY_TEST_PG_URL: postgresql://postgres:local-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sqlalchemy==2.0.44 psycopg2-binary==2.9.11 pytest==8.4.2 httpx==0.28.1 beautifulsoup4==4.14.2 lxml==6.0.2
      - name: Install PostgreSQL17 clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - run: pytest -q tests/test_neon_copy.py tests/test_neon_copy_postgres.py tests/test_read_only_database.py tests/test_financial_ingestion_postgres.py tests/test_paper_campaign_postgres.py
  cloud-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe official sources without database or trading secrets
        # External availability is evidence, not a unit-test or campaign pass.
        continue-on-error: true
        run: python scripts/run_cloud_collection.py --probe --output artifacts/cloud-source-probe.json
      - name: Preserve source-access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-cloud-source-probe
          path: artifacts/cloud-source-probe.json
          if-no-files-found: error
          retention-days: 14
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Save offline deployment readiness inventory
        run: python scripts/check_deployment_readiness.py --plan --output artifacts/deployment-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: pms-deployment-readiness
          path: artifacts/deployment-readiness.json
          retention-days: 14

  ops-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ops.txt
      - run: pytest -q tests/test_worker_reliability.py
      - run: python -c "from packages.pms.workers import celery_app; import packages.pms.worker_tasks_extended; print(sorted(celery_app.conf.beat_schedule))"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Install UI test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: UI interaction and responsive smoke
        run: node tests/smoke.mjs
      - name: Save UI screenshots and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-ui-smoke
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

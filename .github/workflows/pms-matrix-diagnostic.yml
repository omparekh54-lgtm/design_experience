name: PMS matrix acceptance diagnostic

on:
  push:
    branches: [main]
    paths:
      - .audit-trigger/matrix-diagnostic.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_PMS_DATABASE_URL }}
      EXECUTION_MODE: PAPER
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Expose matrix preflight traceback
        run: |
          python - <<'PY'
          from scripts.run_backtest_matrix import main
          rc=main(['--check','--quick','--start','2025-01-01','--end','2026-10-21'])
          raise SystemExit(rc)
          PY

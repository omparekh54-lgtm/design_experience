name: PMS verified recovery backup
on:
  schedule:
    # Weekly Sunday snapshot; no automatic deletion of existing evidence.
    - cron: '11 16 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pms-isolated-recovery-backup
  cancel-in-progress: false
jobs:
  backup-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: local-recovery-only
          POSTGRES_DB: pms_recovery
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEON_PMS_DATABASE_URL: ${{ secrets.NEON_PMS_DATABASE_URL }}
      PMS_NEON_ARCHIVE_JSON: ${{ secrets.PMS_NEON_ARCHIVE_JSON }}
      PMS_RECOVERY_TEST_URL: postgresql://postgres:local-recovery-only@127.0.0.1:5432/pms_recovery
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      PMS_DATABASE_VERIFY_FULL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install PostgreSQL17 clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Back up, download and restore in isolation
        run: python scripts/rehearse_cloud_recovery.py --output recovery.json
      - name: Preserve receipt only, never database dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-recovery-${{ github.run_id }}
          path: recovery.json
          retention-days: 90

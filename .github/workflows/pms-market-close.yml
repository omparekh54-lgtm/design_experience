name: PMS Market Close (PAPER)

on:
  schedule:
    # 19:00, 19:15 and 19:30 IST. The sourced calendar decides sessions, including special weekends.
    - cron: '30,45 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pms-market-close.yml'
      - 'run_benchmark_ingest.py'
      - 'scripts/ingest_module_e_benchmarks.py'
      - 'scripts/run_market_close.py'
      - 'packages/pms/daily_orchestrator.py'

concurrency:
  group: pms-market-close-paper
  cancel-in-progress: false

jobs:
  market-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.PMS_DATABASE_URL }}
      SUPABASE_PROJECT_REF: cxrkicqggsuylirzohqw
      EXECUTION_MODE: PAPER
    steps:
      - uses: actions/checkout@v4

      - name: Check database secret
        id: guard
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PMS_DATABASE_URL is not configured; skipping safely."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh official Module E benchmarks
        if: steps.guard.outputs.skip != 'true'
        run: python run_benchmark_ingest.py

      - name: Run after-market-close PAPER pipeline
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/run_market_close.py | tee daily-run.json

      - name: Save daily run report
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pms-daily-run-${{ github.run_id }}
          path: daily-run.json
          if-no-files-found: ignore
          retention-days: 14

name: PMS Cloud Collection and PAPER

on:
  schedule:
    # 19:07, 19:27 and 19:47 IST; verified calendar and publication checks in Python.
    - cron: '37,57 13 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  group: pms-market-close-paper
  cancel-in-progress: false

jobs:
  collect-and-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_PMS_DATABASE_URL }}
      PMS_NEON_ARCHIVE_JSON: ${{ secrets.PMS_NEON_ARCHIVE_JSON }}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      COLLECTION_ENABLED: ${{ vars.PMS_CLOUD_COLLECTION_ENABLED }}
      PAPER_ENABLED: ${{ vars.PMS_CLOUD_PAPER_ENABLED }}
      PMS_CLOUD_COLLECTION_REQUIRED: '1'
      PMS_DATABASE_VERIFY_FULL: '1'
      EXECUTION_MODE: PAPER
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Check activation and secret
        id: guard
        shell: bash
        run: |
          if [ "$COLLECTION_ENABLED" != "true" ]; then
            echo '::warning::Cloud collection is DISABLED pending deployment configuration; campaign has not started.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_URL" ]; then
            echo '::error::Enabled collection has no NEON_PMS_DATABASE_URL secret.'
            exit 1
          elif [ -z "$PMS_NEON_ARCHIVE_JSON" ]; then
            echo '::error::Enabled collection has no private archive credential.'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collection dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - name: Collect and validate official sources
        if: steps.guard.outputs.enabled == 'true'
        id: collect
        continue-on-error: true
        run: python scripts/run_cloud_collection.py --run --output collection-report.json
      - name: Run separately authorized PAPER lifecycle
        # Settlement gets a chance even if collection fails; the fresh-collection gate blocks entries.
        if: always() && steps.guard.outputs.enabled == 'true' && steps.collect.outcome != 'skipped' && env.PAPER_ENABLED == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_market_close.py | tee daily-run.json
      - name: Preserve collection failure as workflow failure
        if: always() && steps.guard.outputs.enabled == 'true' && steps.collect.outcome != 'success'
        run: exit 1
      - name: Save sanitized reports only (raw files stay in private storage)
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pms-cloud-run-${{ github.run_id }}
          path: |
            collection-report.json
            daily-run.json
          if-no-files-found: warn
          retention-days: 90

name: PMS initial cloud catch-up

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Past completed exchange session within seven days (YYYY-MM-DD)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .audit-trigger/phase1-5-catchup.txt

concurrency:
  group: pms-market-close-paper
  cancel-in-progress: false

jobs:
  verify-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_PMS_DATABASE_URL }}
      PMS_DATABASE_VERIFY_FULL: '1'
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SESSION_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.session_date || '2026-10-21' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify every required source before allowing collection writes
        run: python scripts/verify_cloud_catch_up_sources.py --date "$SESSION_DATE" --output source-preflight/receipt.json
      - name: Preserve sanitized verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-catch-up-source-preflight-${{ github.run_id }}
          path: source-preflight
          if-no-files-found: warn
          retention-days: 14
  catch-up:
    needs: verify-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NEON_PMS_DATABASE_URL }}
      PMS_NEON_ARCHIVE_JSON: ${{ secrets.PMS_NEON_ARCHIVE_JSON }}
      PMS_DATABASE_VERIFY_FULL: '1'
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      EXECUTION_MODE: PAPER
      LIVE_TRADING_ENABLED: 'false'
      SESSION_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.session_date || '2026-10-21' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Catch up bounded data batches with private source archival
        run: python scripts/bootstrap_cloud_collection.py --date "$SESSION_DATE" --passes 24 --output-dir catch-up
      - name: Preserve sanitized receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-initial-catch-up-${{ github.run_id }}
          path: catch-up
          if-no-files-found: warn
          retention-days: 30
